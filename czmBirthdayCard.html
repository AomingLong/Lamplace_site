<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 ℋ𝒶𝓅𝓅𝓎 ℬ𝒾𝓇𝓉𝒽𝒹𝒶𝓎 🎂</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b2b3b 0%, #1c4e6f 100%);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    /* ===== 漂浮装饰背景 ===== */
    .floating-bg { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .floating-bg .deco { position: absolute; opacity: 0.15; font-size: 2.6rem; user-select: none; animation: float 14s infinite ease-in-out; }
    .math-symbol { font-size: 3.2rem; font-weight: 800; color: #ffd966; font-family: 'Courier New', monospace; }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-28px) rotate(8deg) scale(1.08); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    /* 主卡片 */
    .card {
      position: relative; z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-radius: 48px; padding: 2.5rem 2rem 2.2rem;
      max-width: 720px; width: 100%;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-align: center; animation: cardPop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    @keyframes cardPop { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }

    /* 三元素图标区 */
    .sport-math-row { display: flex; align-items: center; justify-content: center; gap: 1.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .icon-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 2.8rem; background: rgba(255, 255, 255, 0.08);
      padding: 12px 18px 6px; border-radius: 40px; border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.25s; animation: iconWiggle 4s infinite alternate;
    }
    .icon-item:hover { background: rgba(255, 215, 0, 0.15); transform: scale(1.03); }
    @keyframes iconWiggle { 0% { transform: rotate(-2deg); } 100% { transform: rotate(2deg); } }
    .icon-label {
      font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
      color: #cfe7ff; font-weight: 500; background: rgba(0, 20, 40, 0.4); padding: 3px 10px; border-radius: 30px;
    }

    /* 英文大标题 */
    .birthday-title {
      font-size: 3.8rem; font-weight: 700; letter-spacing: 2px; margin: 0.5rem 0 1rem;
      font-family: 'Playfair Display', 'Times New Roman', serif; font-style: italic;
      background: linear-gradient(135deg, #ffe99a, #ffc857, #ffad2e);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 20px rgba(255, 190, 40, 0.5); line-height: 1.2;
    }

    /* 副标题 */
    .subhead {
      font-size: 1.15rem; color: #e2f0ff; background: rgba(0, 30, 50, 0.6);
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0.45rem 2rem; border-radius: 100px; backdrop-filter: blur(5px);
      margin-bottom: 1.8rem; border: 1px solid rgba(255, 255, 200, 0.3); letter-spacing: 0.5px;
    }
    .subhead .en-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 1.35rem; color: #ffd966; margin-right: 4px; }

    /* 公式区 */
    .equation-box {
      background: rgba(10, 30, 45, 0.7); border-radius: 30px; padding: 1.2rem;
      margin: 1.2rem 0 1.8rem; border-left: 6px solid #ffd966; border-right: 6px solid #b3d9ff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); font-family: 'Courier New', 'Fira Code', monospace;
      font-weight: 600; color: #f0f9ff; animation: glowPulse 3s infinite alternate;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 215, 0, 0.2); }
      100% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.5); }
    }
    .math-line { font-size: 1.1rem; margin: 0.4rem 0; }
    .math-line span.highlight { background: #ffd966; color: #0a1e2b; padding: 2px 10px; border-radius: 30px; font-weight: 700; }

    /* 祝福语 */
    .message {
      font-size: 1.35rem; color: #fff6e0; line-height: 1.8;
      margin: 1.5rem 0 2rem; padding: 0 0.5rem; text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .message .friend-name {
      font-weight: 800; color: #ffd966; background: rgba(255, 215, 0, 0.15);
      padding: 2px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;
    }

    /* 互动小球区 */
    .ball-row { display: flex; align-items: center; justify-content: center; gap: 2.5rem; margin-top: 0.5rem; margin-bottom: 1.2rem; }
    .ball { cursor: pointer; transition: transform 0.2s, filter 0.2s; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5)); animation: bounce 2.2s infinite; font-size: 2.8rem; line-height: 1; }
    .ball:hover { transform: scale(1.15) rotate(3deg); filter: drop-shadow(0 8px 12px rgba(255, 215, 0, 0.6)); }
    .tennis { animation-delay: 0s; }
    .shuttle-ball { animation-delay: 0.4s; }
    .math-icon { animation-delay: 0.8s; font-size: 2.8rem; font-weight: 800; color: #b3e4ff; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .click-note { font-size: 0.85rem; color: #93b7d0; margin-top: 0.8rem; letter-spacing: 0.5px; opacity: 0.8; }
    .footer {
      margin-top: 1.5rem; font-size: 0.8rem; color: #9bb8cf;
      display: flex; justify-content: center; gap: 1.2rem;
      flex-wrap: wrap; border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 1.2rem;
    }

    /* ===== 左侧小程序式圆形入口 ===== */
    .mini-entry {
      position: fixed;
      left: max(18px, calc(50% - 452px));
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      text-decoration: none;
    }
    .mini-entry .bubble {
      position: relative;
      width: 76px; height: 76px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 34px; line-height: 1;
      background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.42), rgba(255,255,255,.12) 68%);
      border: 1px solid rgba(255, 255, 255, .45);
      backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
      box-shadow: 0 12px 26px -10px rgba(0,0,0,.7), inset 0 1px 2px rgba(255,255,255,.6);
      transition: transform .28s cubic-bezier(.2,.9,.3,1.2), box-shadow .28s;
    }
    /* 呼吸光环 */
    .mini-entry .bubble::after {
      content: ""; position: absolute; inset: -7px; border-radius: 50%;
      border: 1px solid rgba(255, 215, 0, .35);
      animation: entryPulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes entryPulse {
      0%, 100% { transform: scale(.94); opacity: .35; }
      50% { transform: scale(1.05); opacity: .9; }
    }
    .mini-entry:hover .bubble {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 18px 34px -12px rgba(255,215,0,.55), inset 0 1px 2px rgba(255,255,255,.7);
    }
    .mini-entry .cap {
      font-size: 0.78rem; letter-spacing: 1px; color: #d9ecff;
      background: rgba(4, 26, 42, .6);
      padding: 5px 12px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,.18);
      white-space: nowrap;
      transition: background .25s, color .25s;
    }
    .mini-entry:hover .cap { background: rgba(255, 215, 0, .2); color: #fff3c4; }

    @media (max-width: 920px) {
      .mini-entry { left: 14px; top: auto; bottom: 14px; transform: none; gap: 8px; }
      .mini-entry .bubble { width: 58px; height: 58px; font-size: 26px; }
      .mini-entry .cap { font-size: 0.7rem; padding: 4px 10px; }
    }

    @media (max-width: 500px) {
      .card { padding: 1.8rem 1rem; border-radius: 30px; }
      .birthday-title { font-size: 2.8rem; }
      .icon-item { font-size: 2rem; padding: 8px 12px; }
      .message { font-size: 1.15rem; }
      .math-line { font-size: 0.95rem; }
      .ball { font-size: 2.2rem; }
      .subhead { font-size: 0.95rem; padding: 0.35rem 1.2rem; }
      .subhead .en-name { font-size: 1.1rem; }
      .ball-row { gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="floating-bg">
    <div class="deco" style="top: 8%; left: 5%; animation-delay: 0s;">🎾</div>
    <div class="deco math-symbol" style="top: 70%; left: 12%; animation-delay: 0.7s;">∑</div>
    <div class="deco" style="bottom: 10%; right: 15%; animation-delay: 2.3s;">🎾</div>
    <div class="deco math-symbol" style="top: 40%; right: 22%; animation-delay: 1.8s;">π</div>
    <div class="deco math-symbol" style="bottom: 18%; right: 40%; animation-delay: 3.1s; font-size: 2.8rem;">∞</div>
  </div>

  <!-- 左侧圆形小程序式入口：进入羽毛球小游戏 -->
  <a class="mini-entry" href="game.html" title="进入羽毛球小游戏">
    <span class="bubble">🏸</span>
    <span class="cap">羽毛球小游戏</span>
  </a>

  <main class="card">
    <div class="sport-math-row">
      <div class="icon-item"><span>🏸</span><span class="icon-label">羽毛球</span></div>
      <div class="icon-item"><span>🎾</span><span class="icon-label">网球</span></div>
      <div class="icon-item"><span>📐</span><span class="icon-label">数学</span></div>
    </div>

    <h1 class="birthday-title">HAPPY BIRTHDAY</h1>

    <div class="subhead">
      🎉 <span class="en-name">To: Master</span> 陈子木 🎉
    </div>

    <div class="equation-box">
      <div class="math-line">🏸 羽毛球轨迹 = <span class="highlight">∫ 力度 · dt</span> + 快乐常数</div>
      <div class="math-line">🎾 网球旋转 = <span class="highlight">2π · 激情 / 半径</span> + 友谊系数</div>
      <div class="math-line">📐 生日定理: <span class="highlight">幸福 = (热爱 + 陪伴) ^ 时光</span></div>
    </div>

    <div class="message">
      <span class="friend-name">可观测宇宙内最强的大师</span>，<br>
      祝你18岁生日快乐！<br>
      愿你的羽毛球永远<strong>扣杀</strong>精准，<br>
      网球<strong>ACE</strong>连连，数学<strong>证明</strong>题全都得证！
    </div>

    <div class="ball-row">
      <div class="ball tennis" title="点击网球有惊喜" onclick="playSoundAndAlert('tennis')">🎾</div>
      <div class="ball shuttle-ball" title="点击羽毛球有惊喜" onclick="playSoundAndAlert('shuttle')">🏸</div>
      <div class="ball math-icon" title="点击数学符号有惊喜" onclick="playSoundAndAlert('math')">∑</div>
    </div>
    <div class="click-note">🏸 想亲自上场？点左边那颗圆形按钮，进去挥拍、打球、放烟花。</div>

    <div class="footer">
      <span>🏸 羽毛球</span><span>🎾 网球</span><span>📐 数学</span><span>❤️ 友谊</span>
    </div>
  </main>

  <script>
    // ==========================================
    // 互动音效与提示
    // ==========================================
    function playTone(frequency, duration = 0.15) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = frequency;
        gain.gain.value = 0.1; osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration); setTimeout(() => ctx.close(), 300);
      } catch (e) {}
    }

    const messages = {
      tennis: ['🎾 网球定理：快乐 = 2π × 旋转！', '🎾 ACE！祝你人生发球局全部得分！'],
      shuttle: ['🏸 羽毛球公式：扣杀 = 力量 × 角度²', '🏸 高远球划出完美抛物线，生日快乐！'],
      math: ['📐 拉格朗日定理：在你生日这天，快乐存在唯一极大值！', '📐 欧拉恒等式：e^(iπ) + 1 = 0，但你的快乐 = 无穷大']
    };

    function playSoundAndAlert(type) {
      if (type === 'tennis') playTone(880, 0.12);
      else if (type === 'shuttle') playTone(660, 0.12);
      else playTone(1046.50, 0.1);
      const pool = messages[type] || messages.math;
      showToast(pool[Math.floor(Math.random() * pool.length)]);
    }

    function showToast(text) {
      const oldToast = document.querySelector('.custom-toast');
      if (oldToast) oldToast.remove();
      const toast = document.createElement('div');
      toast.className = 'custom-toast';
      toast.textContent = text;
      Object.assign(toast.style, {
        position: 'fixed', bottom: '30px', left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(0,0,0,0.8)', color: '#ffd966', padding: '12px 28px',
        borderRadius: '60px', fontSize: '1.1rem', fontWeight: '600', backdropFilter: 'blur(10px)',
        border: '1px solid #ffd966', boxShadow: '0 10px 25px rgba(0,0,0,0.5)',
        zIndex: '99999', transition: 'opacity 0.3s', pointerEvents: 'none', fontFamily: 'Segoe UI, sans-serif'
      });
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 2000);
    }
  </script>
</body>
</html>
