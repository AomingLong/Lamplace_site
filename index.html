<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 生日贺卡 · 羽毛球·网球·数学</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b2b3b 0%, #1c4e6f 100%);
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 羽毛球 & 网球 漂浮装饰 */
    .floating-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .shuttlecock, .tennis-ball, .math-symbol {
      position: absolute;
      opacity: 0.2;
      font-size: 2.6rem;
      user-select: none;
      animation: float 14s infinite ease-in-out;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
    }

    .math-symbol {
      font-size: 3.2rem;
      font-weight: 800;
      color: #ffd966;
      font-family: 'Courier New', monospace;
      animation-duration: 18s;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-28px) rotate(8deg) scale(1.08); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    /* 主卡片 */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 2rem 2rem 2.2rem;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6),
                  inset 0 1px 4px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-align: center;
      transition: transform 0.3s ease;
      animation: cardPop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 三元素图标区 */
    .sport-math-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 2.8rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px 18px 6px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.25s;
      animation: iconWiggle 4s infinite alternate;
    }

    .icon-item:hover {
      background: rgba(255, 215, 0, 0.15);
      transform: scale(1.03);
    }

    @keyframes iconWiggle {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    .icon-label {
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #cfe7ff;
      font-weight: 500;
      background: rgba(0, 20, 40, 0.4);
      padding: 3px 10px;
      border-radius: 30px;
    }

    /* 主标题 */
    .birthday-title {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0.2rem 0 0.2rem;
      background: linear-gradient(135deg, #ffe99a, #ffc857, #ffad2e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 190, 40, 0.5);
      line-height: 1.2;
    }

    .subhead {
      font-size: 1.15rem;
      color: #e2f0ff;
      font-weight: 400;
      background: rgba(0, 30, 50, 0.6);
      display: inline-block;
      padding: 0.35rem 1.8rem;
      border-radius: 100px;
      backdrop-filter: blur(5px);
      margin-bottom: 1.8rem;
      border: 1px solid rgba(255, 255, 200, 0.3);
      letter-spacing: 0.5px;
    }

    /* 动态数学公式区 */
    .equation-box {
      background: rgba(10, 30, 45, 0.7);
      border-radius: 30px;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0 1.5rem;
      border-left: 6px solid #ffd966;
      border-right: 6px solid #b3d9ff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      font-family: 'Courier New', 'Fira Code', monospace;
      font-weight: 600;
      color: #f0f9ff;
      transition: 0.3s;
      word-break: break-word;
      animation: glowPulse 3s infinite alternate;
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 215, 0, 0.2); }
      100% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.5); }
    }

    .math-line {
      font-size: 1.1rem;
      margin: 0.35rem 0;
    }

    .math-line span.highlight {
      background: #ffd966;
      color: #0a1e2b;
      padding: 2px 10px;
      border-radius: 30px;
      font-weight: 700;
    }

    /* 贺卡祝福语 */
    .message {
      font-size: 1.35rem;
      color: #fff6e0;
      line-height: 1.6;
      margin: 1.5rem 0 1.8rem;
      padding: 0 0.5rem;
      font-weight: 400;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .message .friend-name {
      font-weight: 800;
      color: #ffd966;
      background: rgba(255, 215, 0, 0.15);
      padding: 0 8px;
      border-radius: 20px;
      display: inline-block;
    }

    /* 网球 & 羽毛球 装饰按钮/互动 */
    .ball-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-top: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .ball {
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5));
      animation: bounce 2.2s infinite;
      font-size: 2.6rem;
      line-height: 1;
    }

    .ball:hover {
      transform: scale(1.15) rotate(3deg);
      filter: drop-shadow(0 8px 12px rgba(255, 215, 0, 0.6));
    }

    .tennis {
      animation-delay: 0s;
    }
    .shuttle {
      animation-delay: 0.4s;
    }
    .math-icon {
      animation-delay: 0.8s;
      font-size: 2.6rem;
      font-weight: 800;
      color: #b3e4ff;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 鼠标点击小惊喜 */
    .click-note {
      font-size: 0.8rem;
      color: #93b7d0;
      margin-top: 0.8rem;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }

    /* 页脚 */
    .footer {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #9bb8cf;
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 1rem;
    }

    /* 响应式 */
    @media (max-width: 500px) {
      .card { padding: 1.5rem 1rem; }
      .birthday-title { font-size: 2.6rem; }
      .icon-item { font-size: 2rem; padding: 8px 12px; }
      .message { font-size: 1.1rem; }
      .math-line { font-size: 0.9rem; }
      .ball { font-size: 2rem; }
      .subhead { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- 漂浮背景元素 (羽毛球、网球、数学符号) -->
  <div class="floating-bg">
    <div class="shuttlecock" style="top: 8%; left: 5%; animation-delay: 0s;">🏸</div>
    <div class="tennis-ball" style="top: 18%; right: 8%; animation-delay: 1.2s;">🎾</div>
    <div class="math-symbol" style="top: 70%; left: 12%; animation-delay: 0.7s;">∑</div>
    <div class="shuttlecock" style="bottom: 10%; right: 15%; animation-delay: 2.3s;">🏸</div>
    <div class="tennis-ball" style="bottom: 25%; left: 20%; animation-delay: 0.4s;">🎾</div>
    <div class="math-symbol" style="top: 40%; right: 22%; animation-delay: 1.8s;">π</div>
    <div class="math-symbol" style="bottom: 18%; right: 40%; animation-delay: 3.1s; font-size: 2.8rem;">∞</div>
    <div class="shuttlecock" style="top: 55%; left: 88%; animation-delay: 1.5s;">🏸</div>
    <div class="tennis-ball" style="top: 80%; left: 70%; animation-delay: 2.8s;">🎾</div>
  </div>

  <!-- 主贺卡 -->
  <main class="card">
    <!-- 运动+数学图标区 -->
    <div class="sport-math-row">
      <div class="icon-item">
        <span>🏸</span>
        <span class="icon-label">羽毛球</span>
      </div>
      <div class="icon-item">
        <span>🎾</span>
        <span class="icon-label">网球</span>
      </div>
      <div class="icon-item">
        <span>📐</span>
        <span class="icon-label">数学</span>
      </div>
    </div>

    <!-- 主标题 -->
    <h1 class="birthday-title">HAPPY BIRTHDAY</h1>
    <div class="subhead">🎉 致我超厉害的朋友 🎉</div>

    <!-- 数学与运动结合的动态公式 -->
    <div class="equation-box">
      <div class="math-line">🏸 羽毛球轨迹 = <span class="highlight">∫ 力度 · dt</span> + 快乐常数</div>
      <div class="math-line">🎾 网球旋转 = <span class="highlight">2π · 激情 / 半径</span> + 友谊系数</div>
      <div class="math-line">📐 生日定理: <span class="highlight">幸福 = (热爱 + 陪伴) ^ 时光</span></div>
    </div>

    <!-- 祝福语 (可自定义朋友名字) -->
    <div class="message">
      <span class="friend-name">亲爱的朋友</span>，<br>
      祝你生日快乐！<br>
      愿你的羽毛球永远<strong>扣杀</strong>精准，<br>
      网球<strong>ACE</strong>连连，数学<strong>证明</strong>题全都得证！<br>
      🎂 今天你是最闪亮的质数 🎂
    </div>

    <!-- 可点击的网球/羽毛球/数学图标 (小互动) -->
    <div class="ball-row">
      <div class="ball tennis" title="点击网球有惊喜" onclick="playSoundAndAlert('tennis')">🎾</div>
      <div class="ball shuttle" title="点击羽毛球有惊喜" onclick="playSoundAndAlert('shuttle')">🏸</div>
      <div class="ball math-icon" title="点击数学符号有惊喜" onclick="playSoundAndAlert('math')">∑</div>
    </div>
    <div class="click-note">👆 点击小图标，接收幸运数学公式！</div>

    <!-- 底部小字 -->
    <div class="footer">
      <span>🏸 羽毛球</span>
      <span>🎾 网球</span>
      <span>📐 数学</span>
      <span>❤️ 友谊</span>
    </div>
  </main>

  <script>
    // 简单的音效/弹窗互动（为了不依赖外部文件，使用Web Audio API生成一个短促的“叮”声）
    function playTone(frequency, duration = 0.15) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
        // 关闭上下文以释放资源（适当延迟）
        setTimeout(() => ctx.close(), 300);
      } catch (e) {
        // 静默失败，不影响体验
      }
    }

    // 随机数学/运动祝福语
    const messages = {
      tennis: [
        '🎾 网球定理：快乐 = 2π × 旋转！',
        '🎾 ACE！祝你人生发球局全部得分！',
        '🎾 网前小球，也挡不住你的好运！',
        '🎾 正手反手，都是幸福之手！'
      ],
      shuttle: [
        '🏸 羽毛球公式：扣杀 = 力量 × 角度²',
        '🏸 高远球划出完美抛物线，生日快乐！',
        '🏸 网前搓球，搓出365天好运！',
        '🏸 跳杀！把烦恼全部扣出界外！'
      ],
      math: [
        '📐 拉格朗日定理：在你生日这天，快乐存在唯一极大值！',
        '📐 欧拉恒等式：e^(iπ) + 1 = 0，但你的快乐 = 无穷大',
        '📐 由归纳法可证：你每一天都更闪耀！',
        '📐 微分你的烦恼，积分你的快乐，生日快乐！'
      ]
    };

    function playSoundAndAlert(type) {
      // 根据类型播放不同音高
      if (type === 'tennis') {
        playTone(880, 0.12);  // A5
      } else if (type === 'shuttle') {
        playTone(660, 0.12);  // E5
      } else {
        playTone(1046.50, 0.1); // C6
      }

      // 随机选取一句祝福
      const pool = messages[type] || messages.math;
      const randomMsg = pool[Math.floor(Math.random() * pool.length)];
      
      // 使用一个轻量的toast效果代替alert（更优雅），也可以用alert简单展示
      // 为了保留可玩性，这里创建一个浮动小提示，不打断体验
      showToast(randomMsg);
    }

    // 简单的toast消息
    function showToast(text) {
      // 移除之前的toast
      const oldToast = document.querySelector('.custom-toast');
      if (oldToast) oldToast.remove();

      const toast = document.createElement('div');
      toast.className = 'custom-toast';
      toast.textContent = text;
      toast.style.position = 'fixed';
      toast.style.bottom = '30px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%)';
      toast.style.background = 'rgba(0, 0, 0, 0.8)';
      toast.style.color = '#ffd966';
      toast.style.padding = '12px 28px';
      toast.style.borderRadius = '60px';
      toast.style.fontSize = '1.1rem';
      toast.style.fontWeight = '600';
      toast.style.backdropFilter = 'blur(10px)';
      toast.style.border = '1px solid #ffd966';
      toast.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
      toast.style.zIndex = '9999';
      toast.style.transition = 'opacity 0.3s';
      toast.style.letterSpacing = '0.5px';
      toast.style.pointerEvents = 'none';
      toast.style.maxWidth = '90vw';
      toast.style.textAlign = 'center';
      toast.style.fontFamily = 'Segoe UI, sans-serif';

      document.body.appendChild(toast);
      
      // 自动消失
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 400);
      }, 2000);
    }

    // 再加一点小彩蛋: 在页面任何地方点击都可触发随机飘落的小元素? 可以不做，保持简洁。

    // 初始化时播放一个欢迎音(可选，但可能被浏览器禁止自动播放，所以不添加自动播放)
    // 页面加载时打印友好提示
    console.log('🎂 生日快乐！羽毛球·网球·数学 贺卡已加载');
  </script>
</body>
</html>
