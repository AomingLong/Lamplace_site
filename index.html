<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xbx浓度测试 Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 6px; letter-spacing: 1px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 28px; }
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
            text-align: center;
        }
        input:focus { border-color: #e94560; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .result {
            margin-top: 24px;
            padding: 22px 18px;
            background: #f7f8fc;
            border-radius: 14px;
            display: none;
        }
        .result.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-name { font-size: 15px; color: #666; margin-bottom: 6px; }
        .result-percent {
            font-size: 46px;
            font-weight: 800;
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .result-label { font-size: 15px; color: #444; margin-top: 12px; font-weight: 600; line-height: 1.5; }
        .result-debug { font-size: 12px; color: #999; margin-top: 15px; text-align: left; padding-top: 10px; border-top: 1px dashed #ddd;}
        .error { color: #e74c3c; font-size: 14px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 xbx浓度测试 Pro</h1>
        <p class="subtitle">多维相似度测算（重合度+长度+笔画）</p>

        <input type="text" id="nameInput" placeholder="请输入名字..." maxlength="20" autocomplete="off">
        <button onclick="calculate()">开始测试</button>

        <div class="result" id="result">
            <div class="result-name" id="resultName"></div>
            <div class="result-percent" id="resultPercent"></div>
            <div class="result-label" id="resultLabel"></div>
            <div class="result-debug" id="resultDebug"></div>
        </div>
        <div class="error" id="error"></div>
    </div>

    <script>
        // ====== 隐藏关键词库 ======
        const KEYWORDS = ["xbx", "谢百轩", "谢班长", "谢主任", "buson", "xiebaixuan"];

        // ====== 字母笔画映射（用于计算英文的名字笔画） ======
        const LETTER_STROKES = {
            'a': 3, 'b': 2, 'c': 1, 'd': 2, 'e': 4, 'f': 3, 'g': 2, 'h': 3, 'i': 2, 'j': 2, 
            'k': 3, 'l': 1, 'm': 4, 'n': 3, 'o': 1, 'p': 2, 'q': 2, 'r': 2, 's': 1, 't': 2, 
            'u': 1, 'v': 2, 'w': 4, 'x': 2, 'y': 3, 'z': 3
        };

        // 计算字符串的总笔画（中文按字数估算，英文按字母笔画累加）
        function getTotalStrokes(str) {
            let strokes = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str[i].toLowerCase();
                if (/[\u4e00-\u9fa5]/.test(char)) {
                    // 简单粗暴：汉字一般平均 8-12 画，这里为了趣味性统一定义为 10 画
                    // （因为前端无法直接用原生JS获取真实笔画，硬编码会导致代码极其庞大）
                    strokes += 10; 
                } else if (LETTER_STROKES[char]) {
                    strokes += LETTER_STROKES[char];
                }
            }
            return strokes;
        }

        // 计算重合字符数（去重后）
        function getOverlapCount(a, b) {
            const setA = new Set(a.toLowerCase().split(''));
            const setB = new Set(b.toLowerCase().split(''));
            let count = 0;
            for (const char of setA) {
                if (setB.has(char)) count++;
            }
            return count;
        }

        // ====== 核心算法：多维度相似度计算 ======
        function similarityAdvanced(input, target) {
            if (input === target) return 1.0; // 完全一致直接满分

            const lenA = input.length;
            const lenB = target.length;
            
            // 维度 1：重合字符相似度 (权重 40%)
            const overlap = getOverlapCount(input, target);
            const maxLen = Math.max(lenA, lenB);
            const overlapScore = maxLen === 0 ? 0 : (overlap / maxLen);

            // 维度 2：长度相似度 (权重 30%)
            const lenDiff = Math.abs(lenA - lenB);
            const lengthScore = maxLen === 0 ? 0 : Math.max(0, 1 - (lenDiff / maxLen));

            // 维度 3：笔画数相似度 (权重 30%)
            const strokeA = getTotalStrokes(input);
            const strokeB = getTotalStrokes(target);
            const strokeDiff = Math.abs(strokeA - strokeB);
            const maxStroke = Math.max(strokeA, strokeB) || 1;
            // 笔画差距越大，得分越低
            const strokeScore = Math.max(0, 1 - (strokeDiff / maxStroke));

            // 综合加权得分
            let finalScore = (overlapScore * 0.4) + (lengthScore * 0.3) + (strokeScore * 0.3);

            // 特殊加成：如果包含了完整的关键词，给予极大的加成
            if (input.toLowerCase().includes(target.toLowerCase())) {
                finalScore = Math.max(finalScore, 0.92);
            }

            return Math.min(1, Math.max(0, finalScore));
        }

        // 计算浓度（遍历所有关键词，取最高分）
        function getConcentration(name) {
            let bestScore = 0;
            let bestTarget = "";
            
            for (const kw of KEYWORDS) {
                const score = similarityAdvanced(name, kw);
                if (score > bestScore) {
                    bestScore = score;
                    bestTarget = kw;
                }
            }

            return { 
                percent: Math.round(bestScore * 100), 
                matched: bestTarget,
                inputStrokes: getTotalStrokes(name),
                targetStrokes: getTotalStrokes(bestTarget)
            };
        }

        // ====== 评价区间（保持 3 条随机） ======
        const EVALUATIONS = [
            { min: 100, texts: ["🏆 完全一致！你就是 xbx 本 x，浓度拉满！", "👑 百分百命中！这个浓度已经无法超越了。", "🎯 精准匹配！xbx 浓度检测仪直接爆表！"] },
            { min: 90, texts: ["🔥 浓度爆表！几乎可以确认是 xbx 核心圈成员。", "💥 差一点点就满分，xbx 浓度高得吓人！", "🚀 这浓度也太离谱了，xbx 含量严重超标！"] },
            { min: 75, texts: ["⚡ 高度疑似！xbx 浓度相当可观。", "🌟 浓度很高，大概率与 xbx 有密切关联。", "📡 信号强烈，xbx 浓度进入高警戒区间。"] },
            { min: 55, texts: ["🌀 中度污染，xbx 浓度不容小觑。", "🌊 有一定浓度的 xbx 成分，值得注意。", "🔍 检测到明显的 xbx 痕迹，浓度中等偏上。"] },
            { min: 35, texts: ["🌱 轻度痕迹，xbx 浓度若隐若现。", "🍃 有微弱的 xbx 信号，但还不算明显。", "🌤 浓度偏低，偶尔能捕捉到一点 xbx 气息。"] },
            { min: 15, texts: ["💧 微量残留，xbx 浓度几乎可以忽略。", "🌫 只有极淡的 xbx 痕迹，浓度很低。", "❄️ 检测到一丁点 xbx 成分，微乎其微。"] },
            { min: 0, texts: ["🫧 基本不含 xbx 成分，纯度很高。", "🌿 未检测到明显 xbx 信号，浓度极低。", "🧊 xbx 浓度趋近于零，保持你的独特性！"] }
        ];

        function getEvaluation(percent) {
            for (const level of EVALUATIONS) {
                if (percent >= level.min) {
                    return level.texts[Math.floor(Math.random() * level.texts.length)];
                }
            }
            return EVALUATIONS[EVALUATIONS.length - 1].texts[0];
        }

        function calculate() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            const resultBox = document.getElementById('result');
            const errorBox = document.getElementById('error');
            errorBox.textContent = '';

            if (!name) {
                resultBox.classList.remove('show');
                errorBox.textContent = '请先输入一个名字～';
                return;
            }

            const data = getConcentration(name);
            const label = getEvaluation(data.percent);

            document.getElementById('resultName').textContent = '「' + name + '」的 xbx 浓度';
            document.getElementById('resultPercent').textContent = data.percent + '%';
            document.getElementById('resultLabel').textContent = label;
            
            // 显示维度测算明细（满足你的计算逻辑展示）
            document.getElementById('resultDebug').innerHTML = 
                `🔍 <b>测算依据：</b><br>
                 最接近的隐藏特征：${data.matched}<br>
                 你的输入总笔画/字母数：${data.inputStrokes}<br>
                 目标特征总笔画/字母数：${data.targetStrokes}`;

            resultBox.classList.add('show');
        }

        // 回车键支持
        document.getElementById('nameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calculate();
        });
    </script>
</body>
</html>
